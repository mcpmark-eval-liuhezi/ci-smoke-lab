name: Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Write smoke report
        run: echo "Smoke test passed: CI pipeline executing end to end." > smoke-report.txt
      - name: Upload smoke report artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.txt
