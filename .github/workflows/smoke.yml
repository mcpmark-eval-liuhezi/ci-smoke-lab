name: Smoke Test

on:
  workflow_dispatch:  # manual trigger only - no push/PR events

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Write one-line smoke report
        run: |
          echo "CI smoke test OK: ci-smoke-lab manual dispatch completed successfully." > smoke-report.txt

      - name: Upload smoke report artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.txt
          if-no-files-found: error
